services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nourishlink
      POSTGRES_USER: nourishlink
      POSTGRES_PASSWORD: nourishlink_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nourishlink -d nourishlink"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/nourishlink
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_USERNAME: nourishlink
      DATABASE_PASSWORD: nourishlink_dev
      JPA_DDL_AUTO: validate
      APP_AUTH_REQUIRED: "false"
      APP_FIREBASE_ENABLED: "false"
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
